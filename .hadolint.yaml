# Hadolint Dockerfile-linter config — paired with .github/workflows/security.yml
#
# Hadolint's CI job runs against `Dockerfile` and fails on warnings.
# This file documents the project-wide rule exclusions and *why*.

ignored:
  # DL3008: "Pin versions in apt-get install" — recommends syntax like
  # `apt-get install gcc=4:13.2.0-7` instead of bare `apt-get install gcc`.
  #
  # Reasoning for ignoring: Debian's security team publishes patched
  # versions of packages without bumping the user-visible version
  # (security fixes flow into the `=patched` field of the existing
  # version). Pinning to exact versions therefore *prevents* picking up
  # those patches on `docker build`. It also causes the build to fail
  # outright when Debian removes an older version from its archive
  # (frequent on minor-version churn), which is a worse failure mode
  # than rebuilding against a slightly different package version.
  #
  # The Trivy CI step (in the same workflow) catches CVE regressions
  # against whatever-was-installed at build time, which is the layer
  # that actually matters for security.
  - DL3008

  # DL3005: "Do not use apt-get upgrade or dist-upgrade" — the usual
  # concern is a non-reproducible build silently picking up unrelated
  # package churn between builds.
  #
  # Reasoning for ignoring: added specifically to fix a real Trivy
  # failure (CVE-2026-53612/-53613/-53614/-53615, util-linux) where
  # Debian's security repo had already published the patched packages
  # but the next scheduled python:3.14-slim-trixie base-image rebuild
  # hadn't picked them up yet — bumping our pinned digest alone wasn't
  # enough while that gap existed. `apt-get upgrade` here pulls those
  # patches directly at build time instead of waiting on upstream's
  # rebuild cadence. The same DL3008 reasoning above already applies:
  # Trivy re-scans every build regardless, so reproducibility was
  # already secondary to "ship the patched packages" in this file's
  # design, not a new tradeoff introduced by this rule.
  - DL3005
