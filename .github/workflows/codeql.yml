name: CodeQL

# Static code analysis for security vulnerabilities (SQL injection, XSS,
# path traversal, weak crypto, etc.). Results appear in the repo's
# Security tab under "Code scanning alerts" and gate PRs on findings.
#
# Internet-facing deployments (NomadPortal serves to the public web)
# benefit from this — catches classes of bugs that lint + dependency
# scanning don't see.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monthly on the 15th at 03:00 UTC — staggered from security.yml's
    # 1st-of-month run so they don't both contend for the same shared
    # GitHub Actions queue. PR/push triggers still gate every change.
    - cron: '0 3 15 * *'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Python + JavaScript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds queries beyond the default set; useful
          # for an internet-facing app. Bump to security-and-quality for
          # the most coverage at the cost of more noise.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
