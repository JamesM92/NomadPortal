name: Build

on:
  push:
    # `dev` included so in-progress lint/test feedback runs on every
    # dev push, not just at PR / merge-to-main time. The heavier
    # security.yml and codeql.yml workflows stay on the main + PR
    # path — they're slower and less likely to regress per-commit;
    # the PR-trigger covers them when dev is promoted.
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.5.0

      # Narrow rule set: real bugs only (pyflakes + syntax errors).
      # Style is left to the developer for now.
      - name: Ruff check
        run: ruff check --select F,E9 .

      # Shell scripts had no syntax check at all until now — entrypoint.sh
      # in particular is 400+ lines handling SSL cert generation, MTU
      # detection, and container startup, and is otherwise only ever
      # exercised implicitly by the docker-build job's smoke test (which
      # won't reach every branch). `bash -n` catches a real syntax error
      # (unmatched quote/paren, bad heredoc, etc.) for free.
      - name: Shell syntax check
        run: find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 -n1 bash -n

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Matches Dockerfile's system deps — rns/lxmf/nomadnet's crypto
      # extensions need these to build from source on a fresh runner.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libssl-dev openssl

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/ existed and was pinned via requirements.txt (pytest==9.1.1)
      # but nothing in CI ever actually ran it — the whole suite was
      # enforcing nothing beyond whatever a developer remembered to run
      # locally. No RNS/LXMF network activity here: every test stubs past
      # __init__ (which would otherwise spin up real RNS) and exercises
      # the specific method under test in isolation.
      - name: Run pytest
        run: pytest tests/ -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push, load locally for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nomadportal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container startup smoke test.
      #
      # Catches import errors, config-parse errors, background-thread
      # signal-handler bugs (like the one that shipped in the deferred-RNS
      # refactor and blew up in production), and generally anything that
      # kills startup — the pattern being "container appears up but nothing
      # responds." The signal.signal ValueError we hit would have failed
      # this in <30s if it had existed.
      #
      # Deliberately does NOT try to test real RNS behaviour — there's no
      # mesh in CI. We accept /healthz returning 503 with status=starting
      # as a valid transient state, so long as the container is running
      # and gunicorn is serving. A 200 is a bonus (means RNS came up in
      # CI, which usually happens within 30-60s on a fresh volume).
      - name: Smoke test — container starts and serves HTTP
        # GitHub's default is `bash -e {0}`. That aborts the whole step
        # the first time `curl` returns a non-zero exit code (connection
        # refused during startup), even when we're using `$(...)` and
        # inspecting the output ourselves. Drop `-e` for this step so we
        # can handle each curl outcome explicitly.
        shell: bash --noprofile --norc -o pipefail {0}
        run: |
          set -u

          # helper: print the HTTP status code (or "000" on connection
          # failure) and always exit 0 so callers survive under set -e.
          # `curl -w '%{http_code}'` prints "000" whenever it can't get
          # a response, so we never need to add a fallback ourselves —
          # chaining `|| echo 000` would append to that and give "000000".
          probe() {
            local code
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$1" 2>/dev/null) || :
            printf '%s' "$code"
          }

          docker run -d --name smoke \
            -e ADMIN_PASSWORD=smoketest \
            -e WEB_PORT=8080 \
            -e WEB_PORT_HTTPS= \
            -p 127.0.0.1:8080:8080 \
            nomadportal:ci

          # 1. Gunicorn must accept HTTP within 30s. A valid response is
          #    any 3-digit non-"000" code — curl prints "000" for
          #    connection refused.
          echo "Waiting for gunicorn to accept requests..."
          gunicorn_up=""
          for i in $(seq 1 15); do
            code=$(probe http://127.0.0.1:8080/healthz)
            if [ ${#code} -eq 3 ] && [ "$code" != "000" ]; then
              gunicorn_up=1
              echo "  gunicorn responded after $((i*2))s (healthz: $code)"
              break
            fi
            sleep 2
          done
          if [ -z "$gunicorn_up" ]; then
            echo "::error::gunicorn did not accept any connection within 30s"
            docker logs smoke
            exit 1
          fi

          # 2. Wait up to 3 min for /healthz=200. Accept 503 as transient
          #    (starting up), tolerate "000" (transient connection drops
          #    during a busy startup), fail on any other 5xx.
          echo "Waiting for /healthz=200 or timeout..."
          for i in $(seq 1 90); do
            code=$(probe http://127.0.0.1:8080/healthz)
            case "$code" in
              200)
                echo "  RNS ready after $((i*2))s"
                break ;;
              503|000) ;;             # starting / transient — keep waiting
              5*)
                echo "::error::/healthz returned $code"
                docker logs smoke
                exit 1 ;;
            esac
            sleep 2
          done

          # 3. Login page renders (no auth, no RNS required — pure Flask).
          echo "Checking /auth/login renders..."
          code=$(probe http://127.0.0.1:8080/auth/login)
          case "$code" in
            2*|3*) echo "  /auth/login: $code (OK)" ;;
            *)
              echo "::error::/auth/login returned $code"
              docker logs smoke
              exit 1 ;;
          esac

          # 4. Container is still running (didn't crash mid-test).
          if [ -z "$(docker ps -q --filter name=smoke)" ]; then
            echo "::error::container exited during smoke test"
            docker logs smoke
            exit 1
          fi

          echo "Smoke test passed"
          docker logs --tail 30 smoke

      - name: Cleanup smoke test container
        if: always()
        run: docker rm -f smoke 2>/dev/null || true
