services:
  nomadportal:
    # Pre-built image from GitHub Container Registry. Pin a specific
    # release tag for reproducibility (e.g. ":v0.9.0") or stay on
    # ":latest" to track the most recent non-prerelease tag.
    image: ghcr.io/jamesm92/nomadportal:latest
    # Uncomment to build the image locally from this repo's Dockerfile
    # instead of pulling. Useful for development or running modified code.
    # build: .
    container_name: nomadportal
    restart: unless-stopped
    # Run as UID 1000 (matches the nomadnet user in the image).
    # Ensure the host config directory is owned by that UID:
    #   chown -R 1000:1000 ./config
    user: "1000:1000"
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./config:/config
      - ./site:/site       # optional: add pages/ and files/ here to host a NomadNet node
    environment:
      RNS_CONFIG_DIR: /config/reticulum
      NOMADNET_CONFIG: /config/nomadnetwork
      CONFIG_YML: /config/config.yml
      WEB_HOST: 0.0.0.0
      # Listening ports decide TLS mode by themselves:
      #   WEB_PORT_HTTPS only  → TLS on that port (self-signed cert auto-generated)
      #   WEB_PORT only        → plain HTTP on that port (use behind a reverse proxy)
      #   both set             → HTTPS on WEB_PORT_HTTPS + HTTP→HTTPS redirector on WEB_PORT
      #   both empty           → defaults (HTTPS on 8443 + redirector on 8080)
      WEB_PORT: "8080"
      WEB_PORT_HTTPS: "8443"
      CACHE_TTL: "300"
      LOG_LEVEL: INFO

      # ── Local admin login ──────────────────────────────────────────
      ADMIN_USERNAME: admin
      # Set a strong password here to enable local admin login.
      # Local login is disabled while this is empty (the app logs a warning at startup).
      # CHANGE THIS BEFORE EXPOSING TO ANY NETWORK — "changeme" is a placeholder.
      ADMIN_PASSWORD: "changeme"

      # ── Flask session key ───────────────────────────────────────────
      # Set explicitly so sessions survive container rebuilds.
      FLASK_SECRET_KEY: ""

      # ── Reverse proxy / TLS ─────────────────────────────────────────
      # Set TRUSTED_PROXIES to the number of upstream proxy hops (e.g. 1
      # for a single nginx/Caddy in front). This enables correct client-IP
      # detection for rate limiting. Leave 0 if directly exposed.
      TRUSTED_PROXIES: "0"
      # Set to "true" when TLS is terminated by a reverse proxy and you
      # want the Flask app to redirect plain HTTP → HTTPS.
      HTTPS_REDIRECT: "false"

      # ── Site hosting ────────────────────────────────────────────────
      # Create ./site/pages/ and ./site/files/ on the host. Without any
      # of the options below, the container hosts a *silent* NomadNet
      # node — pages are served to anyone who knows the destination
      # hash, but the node does not broadcast announces and its default
      # name is "NomadPortal-<2 hex>" (last 2 chars of its hash) so
      # multiple installs on the same network don't collide on a single
      # generic name.
      SITE_PAGES_DIR: /site/pages
      SITE_FILES_DIR: /site/files
      #
      # Uncomment SITE_NAME to override the auto-generated suffixed
      # name with something descriptive — operators publishing curated
      # content should set this. Leave it commented for the auto-suffix
      # default. Visible to anyone who receives an announce from this
      # node, and shown in other peers' node sidebars.
      # SITE_NAME: "MyCoolSite"
      #
      # Set SITE_HOSTING=false to skip the hosted node entirely. The
      # container then runs as a pure browser — no destination
      # registered, no announces, no served pages. Useful for read-only
      # NomadPortal deployments (you only browse other people's sites).
      # SITE_HOSTING: "true"
      #
      # Set SITE_ANNOUNCE=true to broadcast a node announce every 6
      # hours (the NomadNet default). Off by default to avoid 20
      # vanilla NomadPortal installs spamming the announce stream of
      # operators running curated content. Operators who actually
      # publish a site should turn this on; readers should leave it
      # off. The "Announce now" button in Admin → Dashboard always
      # works regardless of this setting (one-shot, user-triggered).
      # SITE_ANNOUNCE: "false"

      # ── Virus scanning (file downloads) ─────────────────────────────
      # File downloads from external NomadNet nodes can be scanned with
      # ClamAV (clamd) before they reach the user. Off by default — the
      # frontend pops a "no virus scan was performed" confirm before
      # saving any file. To turn scanning on:
      #
      #   1. Run clamd somewhere NomadPortal can reach. The two common
      #      patterns:
      #
      #      (a) Sidecar in this same compose stack — add a service
      #          using clamav/clamav:latest, then set CLAMD_HOST to that
      #          service's name (e.g. CLAMD_HOST=clamav) and leave
      #          CLAMD_SOCKET empty. Reach over the internal Docker
      #          network on port 3310. The image listens on TCP by
      #          default, so no extra clamd.conf edits are needed.
      #
      #      (b) clamd running on the Docker host (apt install
      #          clamav-daemon). Either bind-mount the Unix socket into
      #          this container (volumes: - /var/run/clamav/clamd.ctl:
      #          /var/run/clamav/clamd.ctl) and set CLAMD_SOCKET to that
      #          path, OR enable clamd's TCP listener in
      #          /etc/clamav/clamd.conf (TCPSocket 3310 + TCPAddr) and
      #          point CLAMD_HOST at host.docker.internal.
      #
      #   2. Set VIRUS_SCAN=clamd to use it fail-open (downloads proceed
      #      with a warning if the scanner is unreachable), or
      #      VIRUS_SCAN=required to fail-closed (downloads blocked if
      #      the scanner is unreachable).
      #
      #   3. Optionally cap the per-file size that gets scanned with
      #      VIRUS_SCAN_MAX_BYTES (default 100 MB — anything larger is
      #      passed through with a "too-large" verdict so the user still
      #      gets the no-scan confirm).
      #
      # Enable by uncommenting the lines below and adjusting CLAMD_HOST
      # or CLAMD_SOCKET. Leave CLAMD_SOCKET empty when using TCP.
      #
      # VIRUS_SCAN: "off"                            # off | clamd | required
      # CLAMD_SOCKET: "/var/run/clamav/clamd.ctl"    # Unix socket (mutually exclusive with CLAMD_HOST)
      # CLAMD_HOST: "clamav"                         # docker-compose service name, or hostname
      # CLAMD_PORT: "3310"                           # clamd default
      # VIRUS_SCAN_MAX_BYTES: "104857600"            # 100 MB; files above this are not scanned

      # ── OIDC / SSO ──────────────────────────────────────────────────
      # Leave empty to disable OIDC entirely (local admin login still works).
      # For real values, copy docker-compose.override.yml.example to
      # docker-compose.override.yml and set them there — keeps secrets out
      # of the committed file and lets your config survive a `git pull`.
      OIDC_CLIENT_ID: ""
      OIDC_CLIENT_SECRET: ""
      # Discovery URL examples:
      #   Keycloak:   https://auth.example.com/realms/<realm>/.well-known/openid-configuration
      #   Authentik:  https://auth.example.com/application/o/<slug>/.well-known/openid-configuration
      #   Auth0:      https://<tenant>.auth0.com/.well-known/openid-configuration
      #   Google:     https://accounts.google.com/.well-known/openid-configuration
      OIDC_DISCOVERY_URL: ""

      OIDC_ALLOWED_EMAILS: ""
      OIDC_ALLOWED_SUBJECTS: ""
      # Users on neither list are treated as standard users. Use the
      # local ADMIN_USERNAME / ADMIN_PASSWORD account as the bootstrap
      # admin, then promote OIDC users from Admin → Users.
      OIDC_ADMIN_EMAILS: ""
      OIDC_ADMIN_SUBJECTS: ""
      # Set to "true" to skip TLS verification of the OIDC provider — only
      # appropriate for trusted-LAN setups with a self-signed Authentik /
      # Keycloak. Logs a warning at startup. Leave empty for production.
      OIDC_INSECURE_SKIP_VERIFY: ""

    # Reticulum needs CAP_NET_RAW for some transports (e.g. LoRa via serial).
    # Remove if you only use TCP/UDP interfaces.
    cap_add:
      - NET_RAW
    # Uncomment for USB radio hardware (RNode, etc.):
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
