{% extends "admin/base.html" %}
{% block title %}Logs{% endblock %}

{% block content %}
<div class="section-title" style="display:flex;align-items:center;gap:14px;">
  Logs
  <span id="status-dot" style="
    width:8px;height:8px;border-radius:50%;
    background:var(--text-dim);display:inline-block;
    transition:background .3s;" title="Stream status"></span>
  <span id="status-label" style="font-size:11px;color:var(--text-dim);font-weight:normal;">connecting…</span>
  <label style="margin-left:auto;font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="autoScroll" checked> Auto-scroll
  </label>
  <button class="btn btn-sm btn-neutral" id="btn-clear-log">Clear view</button>
  <select id="levelFilter" class="btn btn-sm btn-neutral"
          style="padding:3px 8px;cursor:pointer;">
    <option value="">All levels</option>
    <option value="DEBUG">DEBUG</option>
    <option value="INFO">INFO</option>
    <option value="WARNING">WARNING</option>
    <option value="ERROR">ERROR</option>
  </select>
</div>

<div id="log-wrap" data-stream-url="{{ url_for('admin.logs_stream') }}" style="
  background:var(--bg); border:1px solid var(--border); border-radius:3px;
  font-family:var(--font-mono); font-size:12px; line-height:1.6;
  padding:10px 14px; height:calc(100vh - 180px);
  overflow-y:auto; white-space:pre-wrap; word-break:break-all;">
</div>

<style>
  .ll-DEBUG    { color: var(--text-dim); }
  .ll-INFO     { color: var(--text); }
  .ll-WARNING  { color: var(--warn); }
  .ll-ERROR    { color: var(--error); }
  .ll-CRITICAL { color: var(--error); font-weight:bold; }
  .log-line    { display:block; }
  .log-line.hidden { display:none; }
</style>

{% endblock %}
{% block scripts %}<script src="/static/js/admin-logs.js"></script>{% endblock %}
